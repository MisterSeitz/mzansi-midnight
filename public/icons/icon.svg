<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- App Tile Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" stroke="url(#goldBorder)" stroke-width="18" />
  <!-- Tactical Grid Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="476" stroke="#f59e0b" stroke-opacity="0.16" stroke-width="4" stroke-dasharray="10 10" />
  <line x1="36" y1="256" x2="476" y2="256" stroke="#f59e0b" stroke-opacity="0.16" stroke-width="4" stroke-dasharray="10 10" />
  <!-- Inner Tactical Die Block -->
  <rect x="116" y="116" width="280" height="280" rx="54" fill="#0f172a" stroke="#fbbf24" stroke-width="14" />
  <!-- 5-Pip High-Contrast Die Pattern -->
  <circle cx="182" cy="182" r="24" fill="#fef08a" stroke="#f59e0b" stroke-width="5" />
  <circle cx="330" cy="182" r="24" fill="#fef08a" stroke="#f59e0b" stroke-width="5" />
  <circle cx="256" cy="256" r="28" fill="#f87171" stroke="#fecaca" stroke-width="5" />
  <circle cx="182" cy="330" r="24" fill="#6ee7b7" stroke="#ffffff" stroke-width="5" />
  <circle cx="330" cy="330" r="24" fill="#6ee7b7" stroke="#ffffff" stroke-width="5" />
</svg>
